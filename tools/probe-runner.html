<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edgeweaver probe runner</title>
<!--
  Edgeweaver probe runner: one engine, a repository-backed door per target.
  Open by double-click. Bookmarks: probe-runner.html#genesis / probe-runner.html#alpha
  Rules this tool enforces by design:
    - SCENARIO TEXT never enters this app. Scenarios live only in the being's gates repo.
    - Answers pass through (Alan's choice, 2026-07-09) and can be saved directly into a
      local clone of the target's gates repo. Browser storage remains a draft cache only.
    - One being on screen at a time. Comparison between beings lives in
      village/experiment-log.md (D19), never here.
  Config between the EW-CONFIG markers is generated from tools/probe-runner-targets.json
  plus target manifests by scripts/tools/build-probe-runner.mjs. Do not edit it by hand.
-->
<style>
:root { --accent:#334155; --soft:#f1f5f9; --ink:#1e293b; --mut:#64748b; --bg:#fafaf9; --card:#ffffff; --line:#e2e8f0; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
@media (prefers-color-scheme: dark) { :root { --ink:#e2e8f0; --mut:#94a3b8; --bg:#0f172a; --card:#1e293b; --line:#334155; --soft:#1e293b; } }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 system-ui, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
.wrap { max-width:880px; margin:0 auto; padding:16px 16px 80px; }
.banner { border-left:6px solid var(--accent); background:var(--card); padding:12px 16px; border-radius:8px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.banner h1 { margin:0; font-size:20px; } .banner .sub { color:var(--mut); font-size:13px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; }
.card h2 { margin:0 0 8px; font-size:16px; } .card h3 { margin:12px 0 6px; font-size:14px; }
.mut { color:var(--mut); font-size:13px; }
button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 14px; cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.small { padding:3px 10px; font-size:13px; }
button.danger { color:var(--bad); border-color:var(--bad); }
button:disabled { opacity:.45; cursor:not-allowed; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
.chip { display:inline-flex; align-items:center; gap:8px; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-family:Consolas,monospace; font-size:13px; }
input[type=text], input[type=date], input[type=number], select, textarea { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 10px; width:100%; }
textarea { min-height:180px; font-size:14px; }
label { display:block; font-size:13px; color:var(--mut); margin:10px 0 3px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { border:1px solid var(--line); padding:5px 8px; text-align:center; }
th { background:var(--soft); }
td.l, th.l { text-align:left; }
.score { display:flex; gap:4px; }
.score button { padding:4px 0; width:34px; }
.score button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.dots { display:flex; gap:5px; flex-wrap:wrap; margin:6px 0; }
.dot { width:22px; height:22px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; background:var(--card); }
.dot.done { background:var(--accent); color:#fff; border-color:var(--accent); }
.dot.cur { outline:2px solid var(--warn); }
.verdict { border-radius:8px; padding:10px 14px; font-weight:600; }
.verdict.pass { background:#dcfce7; color:#14532d; } .verdict.fail { background:#fee2e2; color:#7f1d1d; }
@media (prefers-color-scheme: dark) { .verdict.pass { background:#14532d; color:#dcfce7; } .verdict.fail { background:#7f1d1d; color:#fee2e2; } }
.note { border-left:4px solid var(--warn); padding:8px 12px; background:var(--soft); border-radius:6px; font-size:13px; margin:8px 0; }
.answerbox { white-space:pre-wrap; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:12px; max-height:420px; overflow:auto; font-size:14px; }
pre.cmd { white-space:pre-wrap; word-break:break-all; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; }
.doors { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.door { border:2px solid var(--line); border-radius:12px; padding:18px; cursor:pointer; background:var(--card); }
.door h2 { margin:0 0 6px; }
.crumb { font-size:13px; color:var(--mut); margin-bottom:8px; }
.crumb a { color:var(--accent); cursor:pointer; text-decoration:underline; }
.flag { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--soft); border:1px solid var(--line); }
.delta-bad { color:var(--bad); font-weight:700; }
.gutdiff { outline:2px solid var(--warn); }
.repo-ok { color:var(--ok); font-weight:600; }
.repo-warn { color:var(--warn); font-weight:600; }
footer { margin-top:28px; font-size:12px; color:var(--mut); }
</style>
</head>

<script>
"use strict";
const CFG = JSON.parse(document.getElementById("ew-config").textContent || "{}");
const root = document.getElementById("root");
let B = null;          // active being config
let D = null;          // active target data (browser draft cache)
let V = { name: "home" }; // view state
const repoHandles = new Map(); // user-approved local repo folders, session only

// ---------- storage ----------
const skey = (k) => "ewpr:" + k;
function loadBeing(k) {
  B = CFG.beings[k];
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(skey(k))); } catch {}
  D = raw || { settings: {}, runs: [] };
  D.settings = Object.assign({
    battery: B.batteryLabelDefault, scenarioCount: B.scenarioCountDefault,
    mind: B.mindDefault, thinking: B.thinkingDefault, rater: B.raterDefault,
    generation: B.generationDefault ?? 0, versionLabel: "",
  }, D.settings);
  save();
}
function save() { if (B) localStorage.setItem(skey(B.key), JSON.stringify(D)); }

// ---------- utils ----------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f2 = (x) => (x == null || Number.isNaN(x)) ? "-" : (Math.round(x * 100) / 100).toFixed(2);
const mean = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function seededShuffle(n, seed) {
  let h = 2166136261;
  for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const a = Array.from({ length: n }, (_, i) => i + 1);
  for (let i = n - 1; i > 0; i--) { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h >>>= 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("copied"); }
  catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("copied"); }
}
function dl(name, content) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: "text/markdown" }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const safePart = (s) => String(s || "run").toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "") || "run";
async function childDir(parent, name) { return parent.getDirectoryHandle(name, { create: true }); }
async function writeRepoFile(dir, name, content) {
  const handle = await dir.getFileHandle(name, { create: true });
  const stream = await handle.createWritable();
  await stream.write(content);
  await stream.close();
}
async function chooseRepoRoot() {
  if (repoHandles.has(B.key)) return repoHandles.get(B.key);
  if (!window.showDirectoryPicker) return null;
  const handle = await window.showDirectoryPicker({ mode: "readwrite", id: "ewpr-" + B.key });
  repoHandles.set(B.key, handle);
  return handle;
}
let toastT = null;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 16px;border-radius:999px;font-size:13px;z-index:9"; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = "none"; }, 1400);
}

// ---------- run math ----------
const runById = (id) => D.runs.find((r) => r.id === id);
function dimMeans(run, pass) {
  const out = {};
  for (const d of B.dimensions) {
    const v = run.scenarios.filter((s) => s[pass] && s[pass][d.key] != null).map((s) => s[pass][d.key]);
    out[d.key] = mean(v);
  }
  return out;
}
const overall = (dm) => mean(Object.values(dm).filter((x) => x != null));
function verdict(run) {
  const dm = dimMeans(run, "formal"), ov = overall(dm), t = B.thresholds, reasons = [];
  for (const d of B.dimensions) if (dm[d.key] != null && dm[d.key] < t.dimMin) reasons.push(`${d.key} mean ${f2(dm[d.key])} is below ${t.dimMin}`);
  if (ov != null && ov < t.overallMin) reasons.push(`overall mean ${f2(ov)} is below ${t.overallMin}`);
  let drift = null;
  if (run.anchorId) {
    const a = runById(run.anchorId);
    if (a) {
      const am = dimMeans(a, "formal"); drift = {};
      for (const d of B.dimensions) {
        if (dm[d.key] == null || am[d.key] == null) continue;
        const delta = dm[d.key] - am[d.key];
        const declared = (run.declared || []).includes(d.key);
        drift[d.key] = { delta, flag: Math.abs(delta) > t.driftMax && !declared, declared };
        if (drift[d.key].flag) reasons.push(`${d.key} drifted ${f2(delta)} vs anchor (limit ${t.driftMax}, not declared)`);
      }
    }
  }
  return { dm, ov, reasons, pass: reasons.length === 0, drift };
}

// ---------- exports ----------
const runFolderName = (run) => `${run.date}-${safePart(run.type)}${run.versionLabel ? "-" + safePart(run.versionLabel) : ""}`;
const runFolder = (run) => `probes/runs/${runFolderName(run)}`;
function scenarioFile(run, s) {
  return `# Scenario ${s.n} answer - ${B.fullName}\n\nrun_id: ${run.id}\ndate: ${run.date}\nmind: ${run.mind}\nthinking: ${run.thinking}\nbattery: ${run.battery}\ngeneration: ${run.generation ?? B.generationDefault ?? 0}\nversion_label: ${run.versionLabel || "(none)"}\n\n---\n\n${s.answer || "(no answer recorded)"}\n`;
}
function scoresMd(run) {
  const v = verdict(run);
  const head = [
    `# Probe run scores - ${B.fullName}`, "",
    `run_id: ${run.id}`, `being: ${B.key}`, `type: ${run.type}`, `date: ${run.date}`,
    `mind: ${run.mind}`, `thinking: ${run.thinking}`, `battery: ${run.battery}`,
    `scenarios: ${run.scenarios.length}`, `generation: ${run.generation ?? B.generationDefault ?? 0}`,
    `version_label: ${run.versionLabel || "(none)"}`, `rater: ${run.rater}`,
    `anchor: ${run.anchorId ? run.anchorId : "(none - this run becomes the anchor)"}`,
    run.declared && run.declared.length ? `declared_deltas: ${run.declared.join(", ")}` : null,
    "",
  ].filter((x) => x !== null);
  const dk = B.dimensions.map((d) => d.key);
  const rows = [`| # | ${dk.join(" | ")} | mean | gut |`, `|---|${dk.map(() => "---").join("|")}|---|---|`];
  for (const s of run.scenarios) {
    const fm = mean(dk.map((k) => s.formal?.[k]).filter((x) => x != null));
    const gm = mean(dk.map((k) => s.gut?.[k]).filter((x) => x != null));
    rows.push(`| ${s.n} | ${dk.map((k) => s.formal?.[k] ?? "-").join(" | ")} | ${f2(fm)} | ${f2(gm)} |`);
  }
  const tail = [
    "",
    `dimension means (formal): ${dk.map((k) => `${k} ${f2(v.dm[k])}`).join(", ")}`,
    `overall mean: ${f2(v.ov)}`,
    `G10 verdict: ${v.pass ? "PASS" : "FAIL: " + v.reasons.join("; ")}`,
    `drift vs anchor: ${v.drift ? dk.map((k) => v.drift[k] ? `${k} ${v.drift[k].delta >= 0 ? "+" : ""}${f2(v.drift[k].delta)}${v.drift[k].flag ? " FLAG" : ""}${v.drift[k].declared ? " (declared)" : ""}` : `${k} -`).join(", ") : "(none)"}`,
  ];
  const notes = run.scenarios.filter((s) => s.note).map((s) => `- scenario ${s.n}: ${s.note}`);
  if (notes.length) tail.push("notes:", ...notes);
  return head.join("\n") + "\n" + rows.join("\n") + "\n" + tail.join("\n") + "\n";
}
function repositoryBundle(run) {
  return JSON.stringify({
    schemaVersion: 1,
    runnerConfigVersion: CFG.version,
    target: { key: B.key, type: B.targetType || "being", fullName: B.fullName },
    canonicalRepo: B.gatesRepo,
    run,
  }, null, 2) + "\n";
}
async function saveRunToRepository(run) {
  const rootHandle = await chooseRepoRoot();
  if (!rootHandle) {
    dl("run.json", repositoryBundle(run));
    alert("This browser cannot write to a chosen repository folder. A run.json bundle was downloaded instead. Place it with the Markdown exports in the target's private gates repository.");
    return;
  }
  if (!confirm(`Save protected ${B.fullName} material inside the selected local clone of its gates repository?\n\nExpected canonical repository: ${B.gatesRepo}\n\nDo not select the main Edgeweaver repository.`)) return;
  let dir = await childDir(rootHandle, "probes");
  dir = await childDir(dir, "runs");
  dir = await childDir(dir, runFolderName(run));
  for (const s of run.scenarios) await writeRepoFile(dir, `scenario-${s.n}.md`, scenarioFile(run, s));
  await writeRepoFile(dir, "scores.md", scoresMd(run));
  await writeRepoFile(dir, "run.json", repositoryBundle(run));
  toast(`saved in ${rootHandle.name}`);
}
function importRepositoryBundle(text) {
  const bundle = JSON.parse(text);
  if (bundle.schemaVersion !== 1 || !bundle.run || !bundle.target) throw new Error("not a probe-runner run.json bundle");
  if (bundle.target.key !== B.key) throw new Error(`this bundle belongs to ${bundle.target.key}, not ${B.key}`);
  const run = bundle.run;
  const prior = runById(run.id);
  if (prior) D.runs[D.runs.indexOf(prior)] = run; else D.runs.push(run);
  save();
  V = { name: "run", runId: run.id };
  render();
  toast("repository run loaded");
}
function parseScoresMd(text) {
  const get = (k) => (text.match(new RegExp("^" + k + ":\\s*(.+)$", "m")) || [])[1]?.trim();
  const being = get("being");
  if (being && being !== B.key) throw new Error(`this scores.md belongs to "${being}", not ${B.key}`);
  const dk = B.dimensions.map((d) => d.key);
  const scenarios = [];
  for (const m of text.matchAll(/^\|\s*(\d+)\s*\|(.+)\|\s*$/gm)) {
    const cells = m[2].split("|").map((c) => c.trim());
    if (cells.length < dk.length + 2) continue;
    const formal = {}; let ok = true;
    dk.forEach((k, i) => { const n = parseInt(cells[i], 10); if (Number.isNaN(n)) ok = false; else formal[k] = n; });
    if (ok) scenarios.push({ n: parseInt(m[1], 10), answer: "", formal, gut: {}, note: "" });
  }
  if (!scenarios.length) throw new Error("no score rows found (expected this app's scores.md format)");
  return {
    id: get("run_id") || `${B.key}-imported-${today()}`, type: get("type") || "baseline",
    date: get("date") || today(), mind: get("mind") || "", thinking: get("thinking") || "",
    battery: get("battery") || "", rater: get("rater") || "", anchorId: null,
    generation: parseInt(get("generation"), 10) || B.generationDefault || 0,
    versionLabel: get("version_label") === "(none)" ? "" : (get("version_label") || ""),
    declared: (get("declared_deltas") || "").split(",").map((s) => s.trim()).filter(Boolean),
    scenarios, phase: "done", imported: true, isAnchor: false,
  };
}

// ---------- views ----------
function render() {
  if (!B) return renderChooser();
  const views = { home, setup, probe, formal, run: runView, runs, card, settings };
  root.innerHTML = header() + (views[V.name] || home)() + footerHtml();
  document.documentElement.style.setProperty("--accent", B.accent);
}
function header() {
  return `<div class="banner"><h1>${esc(B.fullName)} <span class="flag">probe runner</span></h1>
  <div class="sub">${esc(B.parentBody)} · gates: ${esc(B.gatesRepo)}</div>
  <div class="sub">${esc(B.status)}</div>
  <div class="row"><span class="chip">${esc(B.wakeCommand)} <button class="small" onclick="app.copy('${esc(B.wakeCommand)}')">copy</button></span>
  <button class="small" onclick="app.go('home')">home</button>
  <button class="small" onclick="app.go('runs')">runs</button>
  <button class="small" onclick="app.go('card')">ceremony card</button>

    </table></div>

// ---------- actions ----------
window.app = {
  pick(k) { location.hash = "#" + k; },
  door() { location.hash = ""; B = null; D = null; V = { name: "home" }; render(); },
  go(name) { V = { name }; render(); },
  copy: copyText,
  createRun() {
    const g = (id) => document.getElementById(id).value.trim();
    const count = Math.max(1, parseInt(g("f-count"), 10) || B.scenarioCountDefault);
    const type = g("f-type"), date = g("f-date") || today();
    const generation = Math.max(0, parseInt(g("f-generation"), 10) || 0);
    const versionLabel = g("f-version");
    const id = `${B.key}-${type}-${date}${versionLabel ? "-" + safePart(versionLabel) : ""}`;
    if (runById(id)) { toast("a run with this id exists (same type + date)"); return; }
    const run = {
      id, type, date, mind: g("f-mind"), thinking: g("f-think"), battery: g("f-batt"),
      generation, versionLabel,
      rater: g("f-rater"), anchorId: document.getElementById("f-anchor").value || null,
      declared: [...document.querySelectorAll(".f-decl:checked")].map((x) => x.value),
      scenarios: Array.from({ length: count }, (_, i) => ({ n: i + 1, answer: "", gut: {}, formal: {}, note: "" })),
      shuffle: seededShuffle(count, id), phase: "probing", isAnchor: false,
    };
    Object.assign(D.settings, { battery: run.battery, scenarioCount: count, mind: run.mind, thinking: run.thinking, rater: run.rater, generation, versionLabel });
    D.runs.push(run); save();
    V = { name: "probe", runId: id, idx: 0 }; render();
  },
  jump(i) { this._stash(); V.idx = i; render(); },
  _stash() {
    const r = runById(V.runId); if (!r || V.name !== "probe") return;
    const s = r.scenarios[V.idx];
    const a = document.getElementById("f-answer"); if (a) s.answer = a.value.trim();
    const n = document.getElementById("f-note"); if (n) s.note = n.value.trim();
    const cf = document.getElementById("c-fresh"); if (cf) s.fresh = cf.checked;
    const cs = document.getElementById("c-solo"); if (cs) s.solo = cs.checked;
    save();
  },
  score(pass, dim, n, btn) {
    const r = runById(V.runId);
    const s = V.name === "formal" ? r.scenarios.find((x) => x.n === r.shuffle[V.pos]) : r.scenarios[V.idx];
    s[pass] = s[pass] || {}; s[pass][dim] = n; save();
    for (const b of btn.parentElement.children) b.classList.remove("on");
    btn.classList.add("on");
  },
  saveScenario(next) {
    this._stash();
    const r = runById(V.runId);
    if (next) { if (V.idx < r.scenarios.length - 1) V.idx++; }
    toast("saved"); render();
  },
  beginFormal() {
    this._stash();
    const r = runById(V.runId);
    if (!r.scenarios.every((s) => s.answer)) { toast("answers missing"); return; }
    r.phase = "formal"; save(); V = { name: "formal", runId: r.id, pos: 0 }; render();
  },
  nextFormal(pos) {
    const r = runById(V.runId);
    const s = r.scenarios.find((x) => x.n === r.shuffle[pos]);
    if (!s.formal || Object.keys(s.formal).length < B.dimensions.length) { toast("score every dimension first"); return; }
    save(); V.pos = pos + 1; render();
  },
  openRun(id) { V = { name: "run", runId: id }; render(); },
  setAnchor(id) { for (const r of D.runs) r.isAnchor = r.id === id; save(); render(); },
  deleteRun(id) { if (!confirm("Delete this run from the browser? (Exports in the gates repo are unaffected.)")) return; D.runs = D.runs.filter((r) => r.id !== id); save(); V = { name: "runs" }; render(); },
  copyScenario(id, n) { const r = runById(id); copyText(scenarioFile(r, r.scenarios.find((s) => s.n === n))); },
  dlScenario(id, n) { const r = runById(id); dl(`scenario-${n}.md`, scenarioFile(r, r.scenarios.find((s) => s.n === n))); },
  copyScores(id) { copyText(scoresMd(runById(id))); },
  dlScores(id) { dl("scores.md", scoresMd(runById(id))); },
  dlBundle(id) { dl("run.json", repositoryBundle(runById(id))); },
  async saveRunToRepo(id) {
    try { await saveRunToRepository(runById(id)); }
    catch (e) { alert("Repository save did not complete: " + e.message); }
  },
  async saveCurrentToRepo() {
    this._stash();
    const run = runById(V.runId);
    if (!run) return;
    try { await saveRunToRepository(run); }
    catch (e) { alert("Repository save did not complete: " + e.message); }
  },
  async importRunFile(file) {
    if (!file) return;
    try { importRepositoryBundle(await file.text()); }
    catch (e) { alert("Run import failed: " + e.message); }
  },
  importScores() {
    try { const run = parseScoresMd(document.getElementById("f-import").value); D.runs.push(run); save(); toast("imported"); V = { name: "run", runId: run.id }; render(); }
    catch (e) { alert(e.message); }
  },
  saveSettings() {
    D.settings.battery = document.getElementById("s-batt").value.trim();
    D.settings.scenarioCount = parseInt(document.getElementById("s-count").value, 10) || D.settings.scenarioCount;
    D.settings.mind = document.getElementById("s-mind").value.trim();
    D.settings.rater = document.getElementById("s-rater").value.trim();
    D.settings.generation = Math.max(0, parseInt(document.getElementById("s-generation").value, 10) || 0);
    D.settings.versionLabel = document.getElementById("s-version").value.trim();
    save(); toast("saved"); render();
  },
  purge() { if (!confirm(`Really erase all ${B.givenName} runs and settings from this browser?`)) return; localStorage.removeItem(skey(B.key)); loadBeing(B.key); V = { name: "home" }; render(); },
};

// ---------- boot ----------
function route() {
  const k = location.hash.replace("#", "").trim();
  if (k && CFG.beings && CFG.beings[k]) { loadBeing(k); V = { name: "home" }; }
  else { B = null; D = null; }
  render();
}
window.addEventListener("hashchange", route);
if (!CFG.beings || !Object.keys(CFG.beings).length) {
  root.innerHTML = '<div class="card">No being config found. Run: <span class="chip">node scripts/tools/build-probe-runner.mjs</span> and reload.</div>';
} else route();
</script>
</body>
</html>
